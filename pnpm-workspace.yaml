allowBuilds:
  esbuild: true
  sharp: true
# §15: pin vulnerable transitives to their patched floors.
overrides:
  # ^ rather than >=: an open-ended floor let js-yaml jump a major elsewhere in
  # the estate, and >=8.5.18 still admits the postcss versions below 8.5.23 that
  # GHSA-fxqj-rqcc-2cmp covers.
  sharp: "^0.35.0"
  postcss: "^8.5.23"
  # Both fixes are inside the current major; npm/OSV report the newest fixed
  # line instead, and nanoid 5 is ESM-only so it would break postcss.
  js-yaml: "^4.3.1"
  nanoid: "^3.3.17"
# §15 deviation (see README): these two astro advisories are patched only in
# Astro 6 — ignored pending the major migration, review 2026-09-01.
auditConfig:
  ignoreGhsas:
    - GHSA-8hv8-536x-4wqp
    - GHSA-2pvr-wf23-7pc7
