# §15: gates + build + headless harness on every PR. Production deploy on merge
# is handled by Cloudflare Pages' native git integration, not here — that is the
# single §4 deploy path, and this job gates the merge in front of it.
#
# The job is named `ci` because ruleset-main.json requires the status-check
# context "ci" (§4). Rename one and you MUST rename both, or merges block.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:                                   # job name == the required status-check context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.14.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc     # never a hardcoded node-version: (§15)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      # §2 gate: built output must be free of runtime code generation.
      - name: No eval in built output
        run: ./scripts/no-eval.sh dist

      # §1 gate: no mailto: in built output except security.txt.
      - name: No mailto in built output
        run: |
          set -euo pipefail
          hits="$(grep -rn 'mailto:' dist | grep -v '/\.well-known/security\.txt:' || true)"
          if [ -n "$hits" ]; then echo "::error::mailto: link in built output (§1)"; echo "$hits"; exit 1; fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Harness (under real deployed CSP)
        run: pnpm run test

      # Production tree only — a dev-tree advisory never reaches a user (§15).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
